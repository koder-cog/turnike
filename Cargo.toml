[workspace]
resolver = "2"
default-members = ["src/turnike"]
members = [
    "src/turnike-types",
    "src/turnike-client",
    "src/turnike-secret",
    "src/turnike-daemon",
    "src/turnike-cli",
    "src/turnike",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
authors = ["koder-cog <https://github.com/koder-cog>"]
repository = "https://github.com/koder-cog/turnike"
homepage = "https://github.com/koder-cog/turnike"
keywords = ["gsb", "kyk", "captive-portal", "gtk4", "libadwaita"]
categories = ["gui", "network-programming", "command-line-utilities"]
description = "GSB ve KYK yurt ağları için modern masaüstü istemcisi"

[workspace.dependencies]
turnike-types = { path = "src/turnike-types" }
turnike-client = { path = "src/turnike-client" }
turnike-secret = { path = "src/turnike-secret" }
turnike-daemon = { path = "src/turnike-daemon" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["cookies", "json", "rustls-tls"] }
keyring = { version = "4.2", features = ["zbus-secret-service-keyring-store"] }
clap = { version = "4.5", features = ["derive"] }
regex = "1.11"
async-channel = "2.3"
gtk4 = { version = "0.9", features = ["v4_12"] }
libadwaita = { version = "0.7", features = ["v1_7"] }
