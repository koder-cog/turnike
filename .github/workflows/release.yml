name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
      - "[0-9]*"

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-packages:
    name: Build Linux Packages
    runs-on: ubuntu-latest
    needs: release-please
    if: always() && (needs.release-please.outputs.release_created == 'true' || startsWith(github.ref, 'refs/tags/'))

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Target Release Tag
        id: vars
        run: |
          TARGET_TAG="${{ needs.release-please.outputs.tag_name }}"
          if [ -z "$TARGET_TAG" ]; then
            TARGET_TAG="${{ github.ref_name }}"
          fi
          echo "tag=$TARGET_TAG" >> "$GITHUB_OUTPUT"
          echo "Hedef release etiketi: $TARGET_TAG"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev \
            libadwaita-1-dev \
            libsecret-1-dev \
            libssl-dev \
            pkg-config \
            rpm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install packaging tools
        run: |
          cargo install cargo-deb --locked
          cargo install cargo-generate-rpm --locked

      - name: Build release binaries
        run: cargo build --release --workspace

      - name: Build Debian package (.deb)
        run: |
          cd src/turnike
          cargo deb --no-build -p turnike --output ../../target/turnike_${{ steps.vars.outputs.tag }}_amd64.deb

      - name: Build RPM package (.rpm)
        run: |
          cd src/turnike
          cargo generate-rpm --output ../../target/turnike-${{ steps.vars.outputs.tag }}-1.x86_64.rpm

      - name: Create standalone binary tarball
        run: |
          TARBALL_DIR="turnike-${{ steps.vars.outputs.tag }}-linux-x86_64"
          mkdir -p "$TARBALL_DIR"
          cp target/release/turnike "$TARBALL_DIR/"
          cp target/release/turnike-cli "$TARBALL_DIR/"
          cp target/release/turnike-daemon "$TARBALL_DIR/"
          cp -r data "$TARBALL_DIR/"
          cp -r packaging/install.sh "$TARBALL_DIR/"
          cp LICENSE "$TARBALL_DIR/"
          cp README.md "$TARBALL_DIR/"
          tar -czvf "target/${TARBALL_DIR}.tar.gz" "$TARBALL_DIR"

      - name: Generate SHA256 checksums
        run: |
          cd target
          sha256sum turnike*.deb turnike*.rpm turnike*.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload Release Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          files: |
            target/*.deb
            target/*.rpm
            target/*.tar.gz
            target/SHA256SUMS.txt
