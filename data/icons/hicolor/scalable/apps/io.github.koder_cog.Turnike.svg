<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <!-- Base Plate Front Profile (Curved Corner Cylinder Gradient) -->
    <linearGradient id="base-front" x1="22" y1="112" x2="94" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5e5c64"/>
      <stop offset="0.08" stop-color="#9a9996"/>
      <stop offset="0.18" stop-color="#77767b"/>
      <stop offset="0.82" stop-color="#77767b"/>
      <stop offset="0.92" stop-color="#9a9996"/>
      <stop offset="1" stop-color="#5e5c64"/>
    </linearGradient>

    <!-- Pedestal Main Body (Curved Left/Right Edges, Flat Center Plane) -->
    <linearGradient id="pedestal-body" x1="26" y1="76" x2="90" y2="76" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9a9996"/>
      <stop offset="0.08" stop-color="#f6f5f4"/>
      <stop offset="0.18" stop-color="#deddda"/>
      <stop offset="0.88" stop-color="#deddda"/>
      <stop offset="0.95" stop-color="#c0bfbc"/>
      <stop offset="1" stop-color="#77767b"/>
    </linearGradient>

    <!-- Top Control Head Front Profile (Curved Corners, Flat Front Face) -->
    <linearGradient id="head-front" x1="20" y1="48" x2="96" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#77767b"/>
      <stop offset="0.07" stop-color="#deddda"/>
      <stop offset="0.16" stop-color="#9a9996"/>
      <stop offset="0.84" stop-color="#9a9996"/>
      <stop offset="0.93" stop-color="#deddda"/>
      <stop offset="1" stop-color="#77767b"/>
    </linearGradient>

    <!-- Primary Chrome Barrier Arms (Perpendicular Cylinder Gradient) -->
    <linearGradient id="chrome-arm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f5f4"/>
      <stop offset="0.22" stop-color="#ffffff"/>
      <stop offset="0.48" stop-color="#deddda"/>
      <stop offset="0.78" stop-color="#9a9996"/>
      <stop offset="1" stop-color="#5e5c64"/>
    </linearGradient>

    <!-- Rear Standby Chrome Arm (Recessed Darker Cylinder Gradient) -->
    <linearGradient id="chrome-arm-rear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#deddda"/>
      <stop offset="0.25" stop-color="#f6f5f4"/>
      <stop offset="0.55" stop-color="#9a9996"/>
      <stop offset="1" stop-color="#5e5c64"/>
    </linearGradient>

    <!-- Clip Path to Keep Internal Shadows Strictly Inside Pedestal Silhouette -->
    <clipPath id="pedestal-clip">
      <rect x="26" y="46" width="64" height="62" rx="6" ry="6"/>
    </clipPath>
  </defs>

  <!-- 1. Base Plate (Aligned to GNOME HIG y=116 baseline on 2px grid) -->
  <!-- Front 3D Profile (y=108..116) -->
  <rect x="22" y="102" width="72" height="14" rx="6" ry="6" fill="url(#base-front)"/>
  <!-- Flat Top Surface (y=98..110) -->
  <rect x="22" y="98" width="72" height="12" rx="6" ry="6" fill="#c0bfbc"/>
  <!-- Crisp 1px Top Specular Edge -->
  <path d="M 28 98 L 88 98 C 91.3 98 94 100.7 94 104 L 94 105 C 94 101.7 91.3 99 88 99 L 28 99 C 24.7 99 22 101.7 22 105 L 22 104 C 22 100.7 24.7 98 28 98 Z" fill="#f6f5f4" fill-opacity="0.8"/>

  <!-- 2. Main Stainless-Steel Pedestal Cabinet -->
  <!-- Pedestal Bottom Seam -->
  <rect x="26" y="48" width="64" height="60" rx="6" ry="6" fill="#77767b"/>
  <!-- Pedestal Body -->
  <rect x="26" y="46" width="64" height="60" rx="6" ry="6" fill="url(#pedestal-body)"/>

  <!-- Recessed Inner Cutout Bay & Internal Overhead Shadows -->
  <g clip-path="url(#pedestal-clip)">
    <!-- Outer Highlight Rim of Cutout -->
    <path d="M 46 56 L 90 56 L 90 106 L 42 106 L 42 60 C 42 57.8 43.8 56 46 56 Z" fill="#f6f5f4"/>
    <!-- Inner Bevel Wall of Cutout -->
    <path d="M 46 56 L 90 56 L 90 106 L 44 106 L 44 60 C 44 57.8 45.8 56 48 56 Z" fill="#5e5c64"/>
    <!-- Flat Recessed Bay Back Wall (Flat Color per HIG) -->
    <path d="M 48 56 L 90 56 L 90 106 L 46 106 L 46 60 C 46 57.8 47.8 56 50 56 Z" fill="#77767b"/>
    <!-- Overhead Cast Shadow Inside Recess -->
    <rect x="44" y="56" width="46" height="4" fill="#241f31" fill-opacity="0.35"/>
    <!-- Overhead Cast Shadow from Reader Head onto Pedestal -->
    <rect x="26" y="46" width="64" height="8" fill="#241f31" fill-opacity="0.25"/>
    <!-- Cast Shadow from Downward Barrier Arm onto Recessed Wall -->
    <line x1="62" y1="64" x2="50" y2="108" stroke="#241f31" stroke-width="10" stroke-linecap="round" stroke-opacity="0.28"/>
  </g>

  <!-- 3. Top Control Reader Head (GNOME HIG Top + Front Profile Perspective) -->
  <!-- Dark Bottom Rim -->
  <rect x="20" y="20" width="76" height="32" rx="8" ry="8" fill="#5e5c64"/>
  <!-- Front 3D Fascia Profile (y=44..50) -->
  <rect x="20" y="18" width="76" height="32" rx="8" ry="8" fill="url(#head-front)"/>
  <!-- Flat Top Reader Deck Surface (y=12..44) -->
  <rect x="20" y="12" width="76" height="32" rx="8" ry="8" fill="#e8e7e4"/>
  <!-- Crisp 1px Top Rim Highlight -->
  <path d="M 28 12 L 88 12 C 92.4 12 96 15.6 96 20 L 96 21 C 96 16.6 92.4 13 88 13 L 28 13 C 23.6 13 20 16.6 20 21 L 20 20 C 20 15.6 23.6 12 28 12 Z" fill="#ffffff"/>

  <!-- 4. Top Deck Contactless Reader Pads & Center LED Matrix Display -->
  <!-- Left Contactless Reader Pad (2px Grid Aligned) -->
  <rect x="26" y="19" width="16" height="20" rx="4" ry="4" fill="#ffffff" fill-opacity="0.7"/>
  <rect x="26" y="18" width="16" height="20" rx="4" ry="4" fill="#241f31"/>
  <path d="M 29.5 26.5 A 5.5 5.5 0 0 1 38.5 26.5" fill="none" stroke="#62a0ea" stroke-width="2" stroke-linecap="round"/>
  <path d="M 31.5 29.5 A 3 3 0 0 1 36.5 29.5" fill="none" stroke="#99c1f1" stroke-width="2" stroke-linecap="round"/>
  <circle cx="34" cy="32.5" r="1.5" fill="#ffffff"/>

  <!-- Right Contactless Reader Pad (2px Grid Aligned) -->
  <rect x="74" y="19" width="16" height="20" rx="4" ry="4" fill="#ffffff" fill-opacity="0.7"/>
  <rect x="74" y="18" width="16" height="20" rx="4" ry="4" fill="#241f31"/>
  <path d="M 77.5 26.5 A 5.5 5.5 0 0 1 86.5 26.5" fill="none" stroke="#62a0ea" stroke-width="2" stroke-linecap="round"/>
  <path d="M 79.5 29.5 A 3 3 0 0 1 84.5 29.5" fill="none" stroke="#99c1f1" stroke-width="2" stroke-linecap="round"/>
  <circle cx="82" cy="32.5" r="1.5" fill="#ffffff"/>

  <!-- Center Circular Black LED Indicator -->
  <circle cx="58" cy="29" r="12" fill="#ffffff" fill-opacity="0.8"/>
  <circle cx="58" cy="28" r="12" fill="#241f31"/>

  <!-- Glowing Green LED Pass Arrow (High-Contrast for 32px & 64px Scaling) -->
  <path d="M 63 23 L 53 33 M 53 25 L 53 33 L 61 33" fill="none" stroke="#26a269" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.6"/>
  <g fill="#57e389">
    <circle cx="63" cy="23" r="1.6"/>
    <circle cx="60.5" cy="25.5" r="1.6"/>
    <circle cx="58" cy="28" r="1.6"/>
    <circle cx="55.5" cy="30.5" r="1.6"/>
    <circle cx="53" cy="29" r="1.6"/>
    <circle cx="53" cy="25" r="1.6" fill="#33d17a"/>
    <circle cx="57" cy="33" r="1.6"/>
    <circle cx="61" cy="33" r="1.6" fill="#33d17a"/>
    <circle cx="53" cy="33" r="1.8" fill="#8ff0a4"/>
  </g>

  <!-- 5. Tripod Rotating Mechanism & Three Chrome Barrier Arms -->
  <!-- Arm 1: Rear Foreshortened Standby Arm -->
  <g transform="translate(66, 56) rotate(8)">
    <rect x="0" y="-4" width="38" height="8" rx="4" ry="4" fill="url(#chrome-arm-rear)"/>
    <rect x="3" y="-2.5" width="31" height="1.5" rx="0.75" ry="0.75" fill="#ffffff" fill-opacity="0.75"/>
  </g>

  <!-- Arm 2: Downward/Forward Barrier Arm (Reaching y=114 Baseline Area) -->
  <g transform="translate(63, 60) rotate(104)">
    <rect x="0" y="-5" width="56" height="10" rx="5" ry="5" fill="url(#chrome-arm)"/>
    <!-- Machined Socket Collar -->
    <rect x="0" y="-5" width="9" height="10" fill="#77767b"/>
    <rect x="9" y="-5" width="2" height="10" fill="#5e5c64"/>
    <!-- Specular Cylinder Highlight -->
    <rect x="13" y="-3" width="39" height="2" rx="1" ry="1" fill="#ffffff" fill-opacity="0.9"/>
  </g>

  <!-- Arm 3: Primary Horizontal Barrier Arm (Extending to x=115 for Optical Balance) -->
  <g transform="translate(62, 56) rotate(18)">
    <!-- Subtle Drop Shadow Near Hub -->
    <rect x="2" y="-4" width="28" height="12" rx="6" ry="6" fill="#241f31" fill-opacity="0.25"/>
    <!-- Main Chrome Cylinder Tube -->
    <rect x="0" y="-6" width="56" height="12" rx="6" ry="6" fill="url(#chrome-arm)"/>
    <!-- Machined Socket Collar -->
    <rect x="0" y="-6" width="11" height="12" fill="#77767b"/>
    <rect x="11" y="-6" width="2" height="12" fill="#5e5c64"/>
    <!-- Specular Cylinder Highlight -->
    <rect x="15" y="-3.5" width="36" height="2.2" rx="1.1" ry="1.1" fill="#ffffff" fill-opacity="0.95"/>
  </g>

  <!-- Faceted Stainless-Steel Tripod Hub (Flat Shaded Geometric Planes) -->
  <!-- Hub Cast Shadow on Pedestal -->
  <polygon points="52,58 56,52 68,50 74,58 68,68 56,66" fill="#241f31" fill-opacity="0.3"/>
  <!-- Hub Base Silhouette -->
  <polygon points="52,56 56,50 68,48 74,56 68,66 56,64" fill="#77767b"/>
  <!-- Top Lit Facet -->
  <polygon points="56,50 68,48 71,54 59,56" fill="#f6f5f4"/>
  <!-- Upper-Left Facet -->
  <polygon points="52,56 56,50 59,56 56,64" fill="#c0bfbc"/>
  <!-- Main Front Facet -->
  <polygon points="59,56 71,54 68,66 56,64" fill="#deddda"/>
  <!-- Right Bevel Facet -->
  <polygon points="71,54 74,56 68,66" fill="#9a9996"/>
</svg>
